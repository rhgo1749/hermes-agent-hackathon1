known_issues:
  - "Architecture scope: Linux x64/ARM64, macOS ARM64 (Apple Silicon), and Windows x64/ARM64 are supported; macOS x64 (Intel) is not adopted or verified."
  - "Replay (`antigravity-acp-replay`) is an optional compatibility engine disabled by default; add `extra_providers` in `launch_config.json` to enable it."
