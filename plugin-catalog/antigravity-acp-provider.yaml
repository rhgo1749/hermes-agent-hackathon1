version: "0.9.1"
description: "Independent Hermes provider for Google's official Antigravity ACP server (Linux x64/ARM64, macOS ARM64, Windows x64/ARM64): single-plugin install registers one default profile (`antigravity-acp`, Parked-MCP default engine), with Replay (`antigravity-acp-replay`) available as an optional compatibility engine via `launch_config.json`. Disclosure — installs provider source only and runs Google's official Antigravity ACP server (installed separately by the project's installer from dl.google.com, sha256-pinned) as a child process over stdio with a per-session 127.0.0.1 MCP bridge (Parked-MCP); the child holds its own Google sign-in and sends prompts, conversation context, and guarded/redacted files it reads to Google; native shell and file-edit tools are refused so tool work goes through Hermes' own approval-gated tools; Google restricts third-party use of personal Antigravity OAuth, so check your account's terms; not affiliated with or endorsed by Google."
maintainer: rhgo1749
tier: community
